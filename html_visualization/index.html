<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cops and Robbers - Controller Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #4ec9b0;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            background-color: #1177bb;
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        .canvas-container {
            text-align: center;
            margin-bottom: 20px;
        }

        canvas {
            border: 2px solid #4ec9b0;
            background-color: #252526;
        }

        .info-panel {
            background-color: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .label {
            color: #9cdcfe;
        }

        .value {
            color: #ce9178;
            font-weight: bold;
        }

        .controller-input {
            width: 100%;
            height: 300px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-control input {
            width: 150px;
        }

        .log {
            background-color: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry.error {
            color: #f48771;
        }

        .log-entry.success {
            color: #4ec9b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cops and Robbers - Controller Visualization</h1>

        <div class="info-panel">
            <div class="info-row">
                <span class="label">Step:</span>
                <span class="value" id="step">0</span>
            </div>
            <div class="info-row">
                <span class="label">State:</span>
                <span class="value" id="state">0</span>
            </div>
            <div class="info-row">
                <span class="label">Cop Position:</span>
                <span class="value" id="cop-pos">(0, 0)</span>
            </div>
            <div class="info-row">
                <span class="label">Robber Position:</span>
                <span class="value" id="robber-pos">(0, 0)</span>
            </div>
            <div class="info-row">
                <span class="label">Status:</span>
                <span class="value" id="status">Ready</span>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="stepBtn">Step</button>
            <button id="resetBtn">Reset</button>
            <button id="loadControllerBtn">Load Controller</button>
            <div class="speed-control">
                <label for="speedSlider">Speed (ms):</label>
                <input type="range" id="speedSlider" min="100" max="2000" value="500" step="100">
                <span id="speedValue">500</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <div class="info-panel">
            <h3>Controller Code (Paste JavaScript controller here)</h3>
            <textarea class="controller-input" id="controllerCode" placeholder="Paste your converted controller code here...">// Default controller example
function updateState(inputs) {
    const { currentState, Robber_x, Cop_x } = inputs;
    let next_Cop_x = Cop_x;
    let nextState = currentState;

    if (currentState === 0) {
        if (Cop_x !== Robber_x && Cop_x === 3 && Robber_x === 0 && Cop_x > Robber_x) {
            next_Cop_x = Cop_x - 1;
            nextState = 1;
        } else if (Cop_x === Robber_x) {
            nextState = 3;
        } else if (Cop_x !== 3) {
            nextState = 3;
        } else if (Robber_x !== 0) {
            nextState = 3;
        }
    } else if (currentState === 1) {
        if (Cop_x !== Robber_x && Robber_x === 0 && Cop_x > Robber_x) {
            next_Cop_x = Cop_x - 1;
            nextState = 2;
        } else if (Cop_x === Robber_x) {
            nextState = 3;
        }
    } else if (currentState === 2) {
        if (Cop_x !== Robber_x && Robber_x === 0) {
            next_Cop_x = Cop_x - 1;
            nextState = 2;
        } else if (Cop_x === Robber_x) {
            nextState = 3;
        }
    }

    return { currentState: nextState, Cop_x: next_Cop_x };
}</textarea>
        </div>

        <div class="info-panel">
            <h3>Log</h3>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script src="game-engine.js"></script>
    <script src="visualization.js"></script>
</body>
</html>
